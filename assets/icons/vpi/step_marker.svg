<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Step 1 circle -->
  <circle cx="30" cy="30" r="14" stroke="#2ECC71" stroke-width="3" fill="none"/>
  <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2ECC71">1</text>
  <!-- Step 2 circle -->
  <circle cx="70" cy="30" r="14" stroke="#2ECC71" stroke-width="3" fill="none" opacity="0.5"/>
  <text x="70" y="35" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2ECC71" opacity="0.5">2</text>
  <!-- Connecting line -->
  <line x1="44" y1="30" x2="56" y2="30" stroke="#2ECC71" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Arrow pointing right -->
  <polyline points="50,22 56,30 50,38" stroke="#2ECC71" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 3 circle -->
  <circle cx="50" cy="70" r="14" stroke="#2ECC71" stroke-width="3" fill="none" opacity="0.3"/>
  <text x="50" y="75" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2ECC71" opacity="0.3">3</text>
  <!-- Down arrow -->
  <line x1="50" y1="44" x2="50" y2="56" stroke="#2ECC71" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
