<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Umbrella dome -->
  <path d="M10 45 Q10 10 50 10 Q90 10 90 45" stroke="#4A90D9" stroke-width="3" fill="none"/>
  <!-- Handle -->
  <line x1="50" y1="45" x2="50" y2="80" stroke="#4A90D9" stroke-width="3"/>
  <path d="M50 80 Q50 90 40 90" stroke="#4A90D9" stroke-width="3" fill="none"/>
  <!-- Dotted coverage radius -->
  <circle cx="50" cy="45" r="35" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
</svg>
