<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Central node -->
  <circle cx="50" cy="50" r="14" stroke="#1ABC9C" stroke-width="3" fill="none"/>
  <text x="50" y="55" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1ABC9C">U</text>
  <!-- Connected nodes -->
  <circle cx="20" cy="25" r="10" stroke="#1ABC9C" stroke-width="2" fill="none" opacity="0.7"/>
  <text x="20" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1ABC9C" opacity="0.7">A</text>
  <circle cx="80" cy="25" r="10" stroke="#1ABC9C" stroke-width="2" fill="none" opacity="0.7"/>
  <text x="80" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1ABC9C" opacity="0.7">B</text>
  <circle cx="20" cy="75" r="10" stroke="#1ABC9C" stroke-width="2" fill="none" opacity="0.7"/>
  <text x="20" y="79" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1ABC9C" opacity="0.7">C</text>
  <circle cx="80" cy="75" r="10" stroke="#1ABC9C" stroke-width="2" fill="none" opacity="0.7"/>
  <text x="80" y="79" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1ABC9C" opacity="0.7">D</text>
  <!-- Connecting lines -->
  <line x1="30" y1="35" x2="40" y2="42" stroke="#1ABC9C" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="42" x2="70" y2="35" stroke="#1ABC9C" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="65" x2="40" y2="58" stroke="#1ABC9C" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="58" x2="70" y2="65" stroke="#1ABC9C" stroke-width="1.5" opacity="0.5"/>
</svg>
