<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Broken circle -->
  <circle cx="50" cy="50" r="35" stroke="#F1C40F" stroke-width="3" fill="none" stroke-dasharray="80 20"/>
  <!-- Crack line -->
  <polyline points="35,35 45,50 38,55 50,65" stroke="#F1C40F" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Shatter pieces -->
  <polygon points="60,30 68,25 65,35" fill="#F1C40F" opacity="0.6"/>
  <polygon points="72,45 80,40 75,50" fill="#F1C40F" opacity="0.4"/>
  <!-- Hammer -->
  <rect x="62" y="58" width="18" height="8" rx="2" stroke="#F1C40F" stroke-width="2" fill="none" transform="rotate(-30 71 62)"/>
  <line x1="55" y1="72" x2="68" y2="62" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
</svg>
