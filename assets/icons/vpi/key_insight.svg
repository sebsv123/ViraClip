<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Key head (circle) -->
  <circle cx="35" cy="35" r="18" stroke="#2ECC71" stroke-width="3" fill="none"/>
  <!-- Key shaft -->
  <line x1="50" y1="50" x2="78" y2="78" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  <!-- Key teeth -->
  <line x1="70" y1="70" x2="78" y2="78" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="73" y2="83" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  <!-- Lightbulb glow -->
  <circle cx="35" cy="35" r="22" stroke="#F1C40F" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="3 3"/>
</svg>
