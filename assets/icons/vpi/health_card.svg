<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Card outline -->
  <rect x="12" y="20" width="76" height="60" rx="5" stroke="#1ABC9C" stroke-width="3" fill="none"/>
  <!-- Card chip -->
  <rect x="20" y="28" width="20" height="14" rx="2" stroke="#1ABC9C" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Medical cross on card -->
  <rect x="55" y="40" width="8" height="20" rx="2" stroke="#1ABC9C" stroke-width="2" fill="none"/>
  <rect x="48" y="47" width="22" height="8" rx="2" stroke="#1ABC9C" stroke-width="2" fill="none"/>
  <!-- Card text lines -->
  <line x1="20" y1="55" x2="40" y2="55" stroke="#1ABC9C" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="63" x2="35" y2="63" stroke="#1ABC9C" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="71" x2="45" y2="71" stroke="#1ABC9C" stroke-width="1.5" opacity="0.4"/>
</svg>
