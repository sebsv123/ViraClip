<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Calendar body -->
  <rect x="15" y="25" width="70" height="65" rx="4" stroke="#2ECC71" stroke-width="3" fill="none"/>
  <!-- Calendar header -->
  <rect x="15" y="25" width="70" height="20" rx="4" stroke="#2ECC71" stroke-width="3" fill="none"/>
  <!-- Hangers -->
  <line x1="30" y1="15" x2="30" y2="28" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="15" x2="70" y2="28" stroke="#2ECC71" stroke-width="3" stroke-linecap="round"/>
  <!-- Date number -->
  <text x="50" y="70" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#2ECC71">15</text>
  <!-- Deadline marker -->
  <circle cx="75" cy="75" r="8" stroke="#FF4444" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
