worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # ── Upstream pools ──────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ── Shared proxy headers ──────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Main server ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Health check (for Docker / nginx self-check) ─────────────────
        location = /health {
            proxy_pass http://backend/health;
        }

        # ── SSE progress streams — buffering MUST be off ─────────────────
        # Matches: /tasks/{id}/progress  or  /tasks/{id}/stream
        location ~* ^/tasks/[^/]+/(progress|stream)$ {
            proxy_pass http://backend;
            proxy_set_header Connection "";
            proxy_buffering  off;
            proxy_cache      off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering "no";
            chunked_transfer_encoding on;
        }

        # ── Backend API paths ─────────────────────────────────────────────
        # Routes served by FastAPI (not the Next.js frontend)
        location ~ ^/(health|tasks|clips|media|feedback|billing|social|gpu|admin|automation|extras|advanced-ml|llm-ops|creative|metrics|docs|openapi\.json|redoc) {
            proxy_pass http://backend;
            proxy_read_timeout 120s;
        }

        # /api/* prefix — optional convenience alias so you can set
        # NEXT_PUBLIC_API_URL=http://yourdomain.com/api
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_read_timeout 120s;
        }

        # ── Static clip files (served by backend) ────────────────────────
        location /clips/ {
            proxy_pass http://backend/clips/;
            proxy_buffering on;
            proxy_cache_valid 200 1d;
            expires 1d;
        }

        # ── Frontend (Next.js) — everything else ─────────────────────────
        location / {
            proxy_pass http://frontend;
            # WebSocket support (Next.js HMR in dev)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }
    }

    # ── TLS-ready server (uncomment and fill in cert paths for HTTPS) ────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     # ... same location blocks as above ...
    # }
    #
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
}
