# Auto-labeler configuration (used with actions/labeler)
# Labels PRs based on changed files

backend:
  - changed-files:
    - any-glob-to-any-file: 'backend/**'

frontend:
  - changed-files:
    - any-glob-to-any-file: 'frontend/**'

docker:
  - changed-files:
    - any-glob-to-any-file:
      - 'docker-compose*.yml'
      - '**/Dockerfile*'
      - '.dockerignore'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'docs/**'

ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**'
      - '.github/**'

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'backend/requirements*.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

comfyui:
  - changed-files:
    - any-glob-to-any-file: 'comfyui/**'

scripts:
  - changed-files:
    - any-glob-to-any-file:
      - 'scripts/**'
      - '*.sh'
