name: 🐛 Bug Report
description: Something is broken in ViraClip
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "When I upload a video longer than 30 min, the pipeline hangs at the transcript phase..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the bug.
      placeholder: |
        1. Upload video X
        2. Configure settings Y
        3. Click "Process"
        4. See error in logs
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant logs from `docker compose logs backend` or `docker compose logs worker`
      render: shell

  - type: dropdown
    id: phase
    attributes:
      label: Pipeline phase where the bug occurs
      options:
        - Upload / Preflight
        - Transcription (Whisper)
        - Viral Gate / Segment Scoring
        - Creative Pipeline (captions, hooks, B-roll)
        - Render / FFmpeg
        - Export / CDN
        - Frontend / UI
        - Docker / Infrastructure
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ViraClip version / commit SHA
      placeholder: "e.g. main@abc1234 or v1.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Host OS
      options:
        - macOS
        - Ubuntu / Debian
        - Windows (WSL2)
        - Other Linux
    validations:
      required: true
