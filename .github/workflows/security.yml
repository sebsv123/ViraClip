name: Security scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets (detect-secrets)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install detect-secrets
      - run: |
          detect-secrets scan --baseline .secrets.baseline 2>/dev/null || true
          detect-secrets audit .secrets.baseline --report 2>/dev/null || true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  trivy-backend:
    name: Trivy — backend image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t viraclip-backend:scan ./backend

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: viraclip-backend:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
