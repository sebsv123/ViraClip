name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Path filter ──────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      waitlist: ${{ steps.filter.outputs.waitlist }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/tests.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/tests.yml'
            waitlist:
              - 'waitlist/**'

  # ── Backend tests ────────────────────────────────────────────────────────
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: viraclip
          POSTGRES_USER: viraclip
          POSTGRES_PASSWORD: viraclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viraclip -d viraclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://viraclip:viraclip_password@127.0.0.1:5432/viraclip
      TEST_DATABASE_URL: postgresql+asyncpg://viraclip:viraclip_password@127.0.0.1:5432/viraclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: viraclip_test_secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Install backend deps
        run: cd backend && uv sync --all-groups
      - name: Run pytest
        run: cd backend && .venv/bin/pytest -q --maxfail=5
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  # ── Frontend unit tests ──────────────────────────────────────────────────
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: viraclip_test_secret
      BETTER_AUTH_SECRET: viraclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run unit tests
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage
          elif npm run | grep -q "^  test"; then
            npm test
          else
            echo "::warning::No test script defined; skipping"
          fi

  # ── E2E (Playwright) — only when both backend and frontend changed ───────
  e2e:
    needs: [changes, backend, frontend]
    if: |
      always()
      && needs.changes.outputs.backend == 'true'
      && needs.changes.outputs.frontend == 'true'
      && needs.backend.result == 'success'
      && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: viraclip
          POSTGRES_USER: viraclip
          POSTGRES_PASSWORD: viraclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viraclip -d viraclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://viraclip:viraclip_password@127.0.0.1:5432/viraclip
      TEST_DATABASE_URL: postgresql+asyncpg://viraclip:viraclip_password@127.0.0.1:5432/viraclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: viraclip_test_secret
      BETTER_AUTH_SECRET: viraclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: cd backend && uv sync --all-groups
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: cd frontend && npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
