[project]
name = "viraclip-backend"
version = "0.1.0"
description = "Python-based backend for SupoClip"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apify-client>=1.8.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "faster-whisper>=1.0.0",
    "pydantic-ai>=1.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2025.7.21",
    "greenlet>=2.0.0",
    "moviepy>=2.2.1",
    "opencv-python-headless>=4.8.0",
    "assemblyai>=0.35.0",
    "srt>=3.5.3",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "aiofiles>=23.2.0",
    "sse-starlette>=1.6.5",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "resend>=2.13.0",
    "requests>=2.32.0",
    "transformers>=4.40.0",
    "torch==2.10.0+cu130",
    "torchvision==0.25.0+cu130",
    "torchaudio==2.10.0+cu130",
    "sentencepiece>=0.2.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "scenedetect>=0.6.5",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "ultralytics>=8.3.0",
    # ── GPU / Generative AI (Phase 3) ────────────────────────────────────────
    "diffusers>=0.30.0",
    "accelerate>=0.30.0",
    "imageio[ffmpeg]>=2.34.0",
    "peft>=0.11.0",
    "safetensors>=0.4.0",
    "TTS>=0.22.0",
    "imageio-ffmpeg>=0.5.0",
    # ── Monitoring & Automation (Phase 10) ──────────────────────────────────
    "prometheus-client>=0.19.0",
    "google-api-python-client>=2.120.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "skl2onnx>=1.16.0",
    "onnxruntime>=1.17.0",
    # ── LangChain (Phase 10+ AI orchestration) ──────────────────────────────
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv", "__pycache__", "migrations", "alembic",
    "*.egg-info", "htmlcov", "build", "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernise syntax)
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-native rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in default args (FastAPI pattern)
    "B904",   # raise-without-from-inside-except (too noisy in services)
    "SIM108", # ternary operator (readability preference)
    "UP007",  # X | Y union syntax (3.10+, keep Optional for clarity)
]
# Allow unused imports in __init__.py re-exports
per-file-ignores = { "__init__.py" = ["F401"], "tests/*" = ["S101"] }

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring real external services (Redis, DB)",
    "unit: fast isolated tests with no external dependencies",
    "slow: tests taking longer than 5s",
    "performance: marks performance/benchmark tests",
    "stress: marks stress/load tests",
]
addopts = """
--cov=src.auth_headers
--cov=src.services.billing_service
--cov-report=term-missing
--cov-report=html
--cov-fail-under=25
"""
