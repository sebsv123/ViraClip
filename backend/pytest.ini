[pytest]
# Pytest Configuration for ViraClip Backend Tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test organization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires services running)
    performance: Performance benchmarks
    stress: Stress tests (resource intensive)
    slow: Slow tests (>5s)
    skip: Skip by default

# Output options
console_output_style = progress
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Coverage options (if pytest-cov installed)
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Timeout (if pytest-timeout installed)
# timeout = 300

# Parallel execution (if pytest-xdist installed)
# addopts = -n auto
