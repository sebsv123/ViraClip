name: viraclip

# ══════════════════════════════════════════════════════════════════════════
# YAML ANCHORS — reusable blocks for DRY service definitions
# ══════════════════════════════════════════════════════════════════════════

x-core-env: &core-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: 1
  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
  DATABASE_URL: postgresql+asyncpg://viraclip:viraclip_password@postgres:5432/viraclip
  TEMP_DIR: /app/temp/uploads
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ASSEMBLY_AI_API_KEY: ${ASSEMBLY_AI_API_KEY}
  APIFY_API_TOKEN: ${APIFY_API_TOKEN}
  APIFY_YOUTUBE_DEFAULT_QUALITY: ${APIFY_YOUTUBE_DEFAULT_QUALITY:-1080}
  YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY}
  YOUTUBE_METADATA_PROVIDER: ${YOUTUBE_METADATA_PROVIDER:-yt_dlp}
  LLM: ${LLM:-groq:llama-3.1-8b-instant}
  GROQ_API_KEY: ${GROQ_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY}
  OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:8b}
  VISION_ANALYSIS_ENABLED: ${VISION_ANALYSIS_ENABLED:-false}
  WHISPER_DEVICE: cpu
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float32}
  SFX_LIBRARY_PATH: /app/assets/sounds
  QUEUED_TASK_TIMEOUT_SECONDS: ${QUEUED_TASK_TIMEOUT_SECONDS:-600}
  DEFAULT_PROCESSING_MODE: ${DEFAULT_PROCESSING_MODE:-fast}
  FAST_MODE_MAX_CLIPS: ${FAST_MODE_MAX_CLIPS:-3}
  MAX_ELITE_CLIPS: ${MAX_ELITE_CLIPS:-3}
  FAST_MODE_TRANSCRIPT_MODEL: ${FAST_MODE_TRANSCRIPT_MODEL:-nano}
  SELF_HOST: ${SELF_HOST:-true}
  PEXELS_API_KEY: ${PEXELS_API_KEY}
  PEXELS_API_KEY_2: ${PEXELS_API_KEY_2}
  PEXELS_API_KEY_3: ${PEXELS_API_KEY_3}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY}
  COVERR_API_KEY: ${COVERR_API_KEY}
  UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
  FREESOUND_API_KEY: ${FREESOUND_API_KEY}
  FREESOUND_AUTO_MATCH: ${FREESOUND_AUTO_MATCH:-true}
  FREESOUND_SFX_ENABLED: ${FREESOUND_SFX_ENABLED:-true}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  LLM_FALLBACK: ${LLM_FALLBACK:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
  ELEVENLABS_API_KEY_2: ${ELEVENLABS_API_KEY_2}
  VIRAL_SCORING_LLM: ${VIRAL_SCORING_LLM:-}
  VIDEO_CODEC: ${VIDEO_CODEC:-h264_nvenc}
  CUT_ZOOM_ENABLED: ${CUT_ZOOM_ENABLED:-true}
  VIRAL_EFFECTS_ENABLED: ${VIRAL_EFFECTS_ENABLED:-true}
  LUT_DIR: ${LUT_DIR:-/app/assets/luts}
  SFX_MAX_PER_CLIP: ${SFX_MAX_PER_CLIP:-4}
  SFX_VOLUME_DB: ${SFX_VOLUME_DB:--18}
  FREESOUND_CLIENT_ID: ${FREESOUND_CLIENT_ID:-}
  GROQ_REQUESTS_PER_MINUTE: ${GROQ_REQUESTS_PER_MINUTE:-20}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
  COMPOSITE_MIN_CONFIDENCE: ${COMPOSITE_MIN_CONFIDENCE:-0.55}
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
  NVIDIA_DISABLE_REQUIRE: "1"
  CUDA_MODULE_LOADING: LAZY

x-editing-env: &editing-env
  CONTEXTUAL_OVERLAYS_ENABLED: ${CONTEXTUAL_OVERLAYS_ENABLED:-true}
  OVERLAY_FREQUENCY: ${OVERLAY_FREQUENCY:-adaptive}
  MAX_OVERLAYS_PER_CLIP: ${MAX_OVERLAYS_PER_CLIP:-8}
  OVERLAY_MIN_VIRALITY: ${OVERLAY_MIN_VIRALITY:-60.0}
  OVERLAY_CACHE_DIR: ${OVERLAY_CACHE_DIR:-/app/storage/overlay_cache}
  SPEED_CONTROL_ENABLED: ${SPEED_CONTROL_ENABLED:-true}
  SCENE_DETECTION_ENABLED: ${SCENE_DETECTION_ENABLED:-true}
  AUDIO_DUCKING_ENABLED: ${AUDIO_DUCKING_ENABLED:-true}
  AUDIO_LIBRARY_PATH: ${AUDIO_LIBRARY_PATH:-/app/assets/sounds}
  BROLL_ENABLED: ${BROLL_ENABLED:-true}
  VIGNETTE_ENABLED: ${VIGNETTE_ENABLED:-true}
  VIGNETTE_ANGLE: ${VIGNETTE_ANGLE:-PI/15}
  SAM2_ENABLED: ${SAM2_ENABLED:-false}
  MUSIC_DUCKING_ENABLED: ${MUSIC_DUCKING_ENABLED:-true}
  SILENCE_MODE: ${SILENCE_MODE:-cut}
  SILENCE_RAMP_SPEED: ${SILENCE_RAMP_SPEED:-2.0}
  SILENCE_THRESHOLD_SECONDS: ${SILENCE_THRESHOLD_SECONDS:-0.4}
  EP_SATURATION: ${EP_SATURATION:-1.25}
  EP_CONTRAST: ${EP_CONTRAST:-1.10}
  EP_BRIGHTNESS: ${EP_BRIGHTNESS:-0.02}
  EP_SHARPNESS: ${EP_SHARPNESS:-0.8}
  EP_ZOOM_FACTOR: ${EP_ZOOM_FACTOR:-1.12}
  EP_ZOOM_FRAMES: ${EP_ZOOM_FRAMES:-8}
  EP_KB_ZOOM_RATE: ${EP_KB_ZOOM_RATE:-0.00004}
  EP_PI_INTERVAL: ${EP_PI_INTERVAL:-3.5}
  EP_PI_ZOOM: ${EP_PI_ZOOM:-1.04}
  EP_PI_FRAMES: ${EP_PI_FRAMES:-12}
  EP_LUFS_TARGET: ${EP_LUFS_TARGET:--14.0}
  EP_LOWER_THIRD: ${EP_LOWER_THIRD:-true}
  EP_PROGRESS_H: ${EP_PROGRESS_H:-6}
  EP_PROGRESS_COLOR: ${EP_PROGRESS_COLOR:-ff4444}
  EP_PROGRESS_STYLE: ${EP_PROGRESS_STYLE:-solid}
  EP_VOICE_COMPRESS: ${EP_VOICE_COMPRESS:-true}
  EP_FILM_GRAIN: ${EP_FILM_GRAIN:-0}
  EP_WORD_CALLOUT: ${EP_WORD_CALLOUT:-true}
  EP_FACE_ZOOM: ${EP_FACE_ZOOM:-true}
  EP_CALLOUT_FONT_SIZE: ${EP_CALLOUT_FONT_SIZE:-88}
  EP_FONT_PATH: ${EP_FONT_PATH:-/app/fonts/THEBOLDFONT.ttf}
  EP_CALLOUT_DURATION: ${EP_CALLOUT_DURATION:-0.45}
  EP_HOOK_ZOOM_ON: ${EP_HOOK_ZOOM_ON:-true}
  EP_BEAT_SYNC_ON: ${EP_BEAT_SYNC_ON:-false}
  EP_FADE_ON: ${EP_FADE_ON:-true}
  EP_FADE_DURATION: ${EP_FADE_DURATION:-0.25}
  EP_CTA_ON: ${EP_CTA_ON:-false}
  EP_CTA_TEXT: ${EP_CTA_TEXT:-Follow for more!}
  EP_CTA_DURATION: ${EP_CTA_DURATION:-2.0}
  EP_CTA_FONT_SIZE: ${EP_CTA_FONT_SIZE:-54}
  EP_SAT_PULSE_ON: ${EP_SAT_PULSE_ON:-true}
  EP_SAT_PULSE_STRENGTH: ${EP_SAT_PULSE_STRENGTH:-1.20}
  EP_LETTERBOX_ON: ${EP_LETTERBOX_ON:-false}
  EP_LETTERBOX_H: ${EP_LETTERBOX_H:-0.07}
  EP_WATERMARK_ON: ${EP_WATERMARK_ON:-false}
  EP_WATERMARK_TEXT: ${EP_WATERMARK_TEXT:-}
  EP_THEME_GRADE_ON: ${EP_THEME_GRADE_ON:-true}
  EP_THEME_EQ_ON: ${EP_THEME_EQ_ON:-true}
  HOOK_SLOWMO_ENABLED: ${HOOK_SLOWMO_ENABLED:-true}
  HOOK_SLOWMO_DURATION: ${HOOK_SLOWMO_DURATION:-1.5}
  HOOK_SLOWMO_SPEED: ${HOOK_SLOWMO_SPEED:-0.5}

x-ai-env: &ai-env
  COMFYUI_ENABLED: ${COMFYUI_ENABLED:-false}
  COMFYUI_HOST: ${COMFYUI_HOST:-comfyui}
  COMFYUI_PORT: ${COMFYUI_PORT:-8188}
  COMFYUI_TIMEOUT: ${COMFYUI_TIMEOUT:-600}
  COMFYUI_INPUT_HOST_DIR: /app/temp/uploads
  COMFYUI_SHARED_INPUT_DIR: ${COMFYUI_SHARED_INPUT_DIR:-/app/temp/uploads/broll}
  COMFYUI_LOCAL_OUTPUT_DIR: ${COMFYUI_LOCAL_OUTPUT_DIR:-/app/temp/uploads/comfy_out}
  VIRA_UPLOADS: ${VIRA_UPLOADS:-/app/temp/uploads/broll}
  VIRA_OUTPUTS: ${VIRA_OUTPUTS:-/app/temp/uploads/comfy_out}
  LTXV_ENABLED: ${LTXV_ENABLED:-false}
  LTXV_INTRO_ENABLED: ${LTXV_INTRO_ENABLED:-true}
  LTXV_BROLL_MAX_PER_CLIP: ${LTXV_BROLL_MAX_PER_CLIP:-2}
  LTXV_CLIP_TIMEOUT_SEC: ${LTXV_CLIP_TIMEOUT_SEC:-180}
  BROLL_PROVIDER_PRIORITY: ${BROLL_PROVIDER_PRIORITY:-premium_first}
  BROLL_ENABLE_PREMIUM: ${BROLL_ENABLE_PREMIUM:-true}
  BROLL_ENABLE_STOCK: ${BROLL_ENABLE_STOCK:-true}
  HOOK_VISUAL_ENABLED: ${HOOK_VISUAL_ENABLED:-true}
  CINEMATIC_INTRO_ENABLED: ${CINEMATIC_INTRO_ENABLED:-true}
  BROLL_USE_IMAGES: ${BROLL_USE_IMAGES:-true}
  BROLL_MAX_OVERLAYS: ${BROLL_MAX_OVERLAYS:-8}
  BROLL_SLOT_TIMEOUT_SEC: ${BROLL_SLOT_TIMEOUT_SEC:-30}
  BROLL_MIN_SPACING_SEC: ${BROLL_MIN_SPACING_SEC:-3.0}
  T2V_ENABLED: ${T2V_ENABLED:-false}
  T2V_MODEL: ${T2V_MODEL:-cogvideox}
  T2V_RESOLUTION: ${T2V_RESOLUTION:-720p}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  T2V_CACHE_DIR: ${T2V_CACHE_DIR:-/app/models/t2v}
  RVC_ENABLED: ${RVC_ENABLED:-false}
  RVC_MODEL_PATH: ${RVC_MODEL_PATH:-/app/models/rvc/model.pth}
  ESRGAN_ENABLED: ${ESRGAN_ENABLED:-false}
  ESRGAN_SCALE: ${ESRGAN_SCALE:-2}
  UPSCALING_MODEL: ${UPSCALING_MODEL:-realesrgan-x2}
  UPSCALING_MODELS_DIR: ${UPSCALING_MODELS_DIR:-/app/models/esrgan}
  TTS_NARRATION_ENABLED: ${TTS_NARRATION_ENABLED:-false}
  TTS_MODEL: ${TTS_MODEL:-xtts-v2}
  TTS_LANGUAGE: ${TTS_LANGUAGE:-en}
  TTS_SNR_THRESHOLD_DB: ${TTS_SNR_THRESHOLD_DB:-15.0}
  TTS_CACHE_DIR: ${TTS_CACHE_DIR:-/app/models/tts}
  LORA_OUTPUT_DIR: ${LORA_OUTPUT_DIR:-/app/models/lora}
  LORA_CACHE_DIR: ${LORA_CACHE_DIR:-/app/models/lora_cache}

x-worker-volumes: &worker-volumes
  - ./backend/src:/app/src
  - shared_temp:/app/temp
  - ./exports/clips:/app/exports/clips
  - whisper_models:/app/models
  - ./backend/fonts:/app/fonts
  - ./backend/transitions:/app/transitions
  - ${DOWNLOADS_PATH:-./downloads}:/app/temp/uploads/downloads
  - ./backend/music:/app/assets/sounds
  - ./backend/comfy_workflows:/app/comfy_workflows
  - uploads:/app/temp/uploads/broll

x-gpu-reserve: &gpu-reserve
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu, video]

x-worker-deps: &worker-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-worker-base: &worker-base
  build: ./backend
  platform: linux/amd64
  command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
  restart: always
  user: "0:0"
  dns:
    - 8.8.8.8
    - 1.1.1.1
  healthcheck:
    test: ["CMD-SHELL", "bash /app/scripts/healthcheck.sh"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s
  volumes: *worker-volumes
  depends_on: *worker-deps
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu, video]
      limits:
        memory: 6G

# ══════════════════════════════════════════════════════════════════════════
# SERVICES
# ══════════════════════════════════════════════════════════════════════════

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-development}
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        - NEXT_PUBLIC_SELF_HOST=${SELF_HOST:-true}
        - NEXT_PUBLIC_PRO_PRICE_MONTHLY=${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-9.99}
        - NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT=${NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT:-10}
        - NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT=${NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT:-200}
    container_name: viraclip-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/prisma:/app/prisma
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SELF_HOST: ${SELF_HOST:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_LANDING_ONLY_MODE: ${NEXT_PUBLIC_LANDING_ONLY_MODE:-false}
      BACKEND_AUTH_SECRET: ${BACKEND_AUTH_SECRET}
      DATABASE_URL: postgresql://viraclip:viraclip_password@postgres:5432/viraclip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-viraclip_dev_secret_change_in_production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      NEXT_PUBLIC_PRO_PRICE_MONTHLY: ${NEXT_PUBLIC_PRO_PRICE_MONTHLY:-9.99}
      NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT: ${NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT:-10}
      NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT: ${NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT:-200}
      STRIPE_CHECKOUT_URL: ${STRIPE_CHECKOUT_URL}
      STRIPE_CUSTOMER_PORTAL_URL: ${STRIPE_CUSTOMER_PORTAL_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viraclip-backend
    platform: linux/amd64
    command: [".venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - shared_temp:/app/temp
      - ./exports/clips:/app/exports/clips
      - whisper_models:/app/models
      - ./backend/fonts:/app/fonts
      - ./backend/transitions:/app/transitions
      - ./backend/music:/app/assets/sounds
      - ./backend/comfy_workflows:/app/comfy_workflows
      - llm_datasets:/app/datasets
    environment:
      <<: [*core-env, *editing-env, *ai-env]
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-large-v3}
      BACKEND_AUTH_SECRET: ${BACKEND_AUTH_SECRET}
      AUTH_SIGNATURE_TTL_SECONDS: ${AUTH_SIGNATURE_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://sp.localhost:3000}
      FREE_PLAN_TASK_LIMIT: ${FREE_PLAN_TASK_LIMIT:-10}
      PRO_PLAN_TASK_LIMIT: ${PRO_PLAN_TASK_LIMIT:-0}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-ViraClip <onboarding@resend.dev>}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_SECRET: ${ADMIN_SECRET:-change_me_admin_secret}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      FEEDBACK_ENABLED: ${FEEDBACK_ENABLED:-false}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      RUST_AGENT_URL: ${RUST_AGENT_URL:-http://rust-agent:8001}
      RUST_AGENT_ENABLED: ${RUST_AGENT_ENABLED:-false}
      DATASET_DIR: ${DATASET_DIR:-/app/datasets}
      LLM_ROUTING_ENABLED: ${LLM_ROUTING_ENABLED:-false}
      DSPY_OPTIMIZED_PROMPT_PATH: ${DSPY_OPTIMIZED_PROMPT_PATH:-/app/datasets/dspy_optimized_prompt.txt}
    deploy: *gpu-reserve
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/db"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service.description=FastAPI backend API"
      - "service.group=backend"

  comfyui:
    profiles: ["disabled"]
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: viraclip-comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./comfyui/custom_nodes:/comfyui/custom_nodes
      - ./workflows:/comfyui/workflows
      - ./transitions:/comfyui/transitions
      - uploads:/comfyui/input
      - ~/CascadeProjects/ViraClip/outputs:/comfyui/output
      - ~/CascadeProjects/ViraClip/models:/comfyui/models
    environment:
      OMP_NUM_THREADS: 8
      VIRACLIP_API_URL: http://backend:8000
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 10G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8188/system_stats || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  worker:
    <<: *worker-base
    container_name: viraclip-worker
    runtime: nvidia
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    environment:
      <<: [*core-env, *editing-env, *ai-env]
      NVIDIA_REQUIRE_CUDA: ""
      NVIDIA_DRIVER_CAPABILITIES: all
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      RENDER_CONCURRENCY: 4
      FFMPEG_BINARY: /usr/local/bin/ffmpeg

  worker-2:
    <<: *worker-base
    profiles: ["scale"]
    container_name: viraclip-worker-2
    runtime: nvidia
    environment:
      <<: [*core-env, *editing-env, *ai-env]
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      RENDER_CONCURRENCY: 2

  worker-3:
    <<: *worker-base
    profiles: ["scale"]
    container_name: viraclip-worker-3
    runtime: nvidia
    environment:
      <<: [*core-env, *editing-env, *ai-env]
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      RENDER_CONCURRENCY: 4

  watchdog:
    <<: *worker-base
    command: [".venv/bin/python", "-m", "src.services.watchdog_service"]
    container_name: viraclip-watchdog
    restart: always
    runtime: ""
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      WATCHDOG_INTERVAL_SECONDS: 60
      WATCHDOG_WORKER_CONTAINER: viraclip-worker

  diagnostic:
    <<: *worker-base
    command: [".venv/bin/python", "-m", "src.workers.code_diagnostic_agent", "--watch"]
    container_name: viraclip-diagnostic
    restart: always
    runtime: ""
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      WATCHDOG_WORKER_CONTAINER: viraclip-worker
      REPO_ROOT: /app
      LOG_FILE: /var/log/worker/worker.log
    volumes:
      - worker_logs:/var/log/worker

  gpu_worker:
    profiles: ["gpu"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viraclip-gpu-worker
    platform: linux/amd64
    command: [".venv/bin/arq", "src.workers.gpu_tasks.GpuWorkerSettings"]
    volumes:
      - ./backend/src:/app/src
      - shared_temp:/app/temp
      - viraclip_clips:/app/exports/clips
      - whisper_models:/app/models
      - ./backend/fonts:/app/fonts
      - ./backend/transitions:/app/transitions
      - ${DOWNLOADS_PATH:-./downloads}:/app/temp/uploads/downloads
      - ./backend/music:/app/assets/sounds
      - ./backend/comfy_workflows:/app/comfy_workflows
      - gpu_models_t2v:/app/models/t2v
      - gpu_models_tts:/app/models/tts
      - gpu_models_esrgan:/app/models/esrgan
      - gpu_models_rvc:/app/models/rvc
      - gpu_models_lora:/app/models/lora
      - gpu_models_lora_cache:/app/models/lora_cache
      - uploads:/app/temp/uploads/broll
    environment:
      <<: [*core-env, *ai-env]
      GPU_WORKER_ENABLED: "true"
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-large-v3}
      BROLL_ENABLED: "true"
      T2V_MODEL: ${T2V_MODEL:-ltx-video}
      T2V_CACHE_DIR: /app/models/t2v
      RVC_MODEL_PATH: /app/models/rvc/model.pth
      UPSCALING_MODEL: ${UPSCALING_MODEL:-realesrgan}
      UPSCALING_MODELS_DIR: /app/models/esrgan
      TTS_CACHE_DIR: /app/models/tts
      LORA_OUTPUT_DIR: /app/models/lora
      LORA_CACHE_DIR: /app/models/lora_cache
    deploy: *gpu-reserve
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ollama:
    profiles: ["vision"]
    image: ollama/ollama:latest
    container_name: viraclip-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null && echo ok || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  redis:
    container_name: viraclip-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      [
        "sh",
        "-c",
        "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec docker-entrypoint.sh redis-server --requirepass \"$${REDIS_PASSWORD}\"; fi; exec docker-entrypoint.sh redis-server",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  rust-agent:
    profiles: ["rust"]
    build:
      context: ./rust-agent
      dockerfile: Dockerfile
    container_name: viraclip-rust-agent
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/agent/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    environment:
      RUST_AGENT_PORT: 8001
      WORKDIR: /app/temp
      RUST_LOG: info
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - shared_temp:/app/temp
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    container_name: viraclip-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viraclip
      POSTGRES_USER: viraclip
      POSTGRES_PASSWORD: viraclip_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viraclip -d viraclip"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    profiles: ["proxy"]
    image: nginx:alpine
    container_name: viraclip-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ══════════════════════════════════════════════════════════════════════════

volumes:
  shared_temp:
  uploads:
  viraclip_clips:
  whisper_models:
  redis_data:
  postgres_data:
  ollama_models:
  comfyui_output:
  comfyui_input:
  gpu_models_t2v:
  gpu_models_tts:
  gpu_models_esrgan:
  gpu_models_rvc:
  gpu_models_lora:
  gpu_models_lora_cache:
  llm_datasets:
  worker_logs:

networks:
  default:
    name: viraclip
