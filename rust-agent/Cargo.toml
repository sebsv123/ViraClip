[package]
name = "viraclip-agent"
version = "0.1.0"
edition = "2024"
authors = ["ViraClip Team"]
license = "MIT"

[dependencies]
# Core async runtime
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-trait = "0.1"

# HTTP server & client
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"
reqwest = { version = "0.12", features = ["json"] }

# AI framework
rig-core = "0.34"

# FFmpeg native bindings
ffmpeg-next = { version = "8.0.0" }

# Redis for job queue
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# TUI dashboard
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"
walkdir = "2"
once_cell = "1"
parking_lot = "0.12"
which = "7"

# Process execution
nix = { version = "0.29", features = ["process", "signal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "viraclip-agent"
path = "src/main.rs"

[[bin]]
name = "viraclip-tui"
path = "src/tui.rs"
